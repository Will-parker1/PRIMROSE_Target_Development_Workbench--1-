apiVersion: v1
kind: Service
metadata:
  name: primrose
  namespace: primrose
  labels:
    app: primrose
spec:
  type: NodePort
  selector:
    app: primrose
  ports:
    - name: http
      port: 3000
      targetPort: http
      # Only the frontend port is exposed. The backend's port 8080 is
      # reachable only over the Pod's loopback interface, matching the
      # existing "never expose the raw backend port" security boundary.
